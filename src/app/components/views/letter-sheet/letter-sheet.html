<main class="paper container container-m">
  <h2>Übungs<wbr />blatt</h2>
  <div class="form-group">
    <label for="text">Vorname</label>
    <input
      id="text"
      type="text"
      placeholder="Vorname eingeben"
      [ngModel]="text()"
      (ngModelChange)="text.set($event)"
    />
  </div>
  <button
    class="paper-btn btn-primary"
    type="button"
    (click)="generatePdf()"
    [disabled]="lines().length === 0"
  >
    PDF erzeugen
  </button>
</main>
