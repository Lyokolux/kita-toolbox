<nav class="border fixed split-nav">
  <div class="nav-brand">
    <h3><a href="#">Kita Toolbox</a></h3>
  </div>
  <div class="collapsible">
    <input id="collapsible1" type="checkbox" name="collapsible1" />
    <label for="collapsible1">
      <div class="bar1"></div>
      <div class="bar2"></div>
      <div class="bar3"></div>
    </label>
    <div class="collapsible-body">
      <ul class="inline">
        <li><a href="#">Übungsblatt</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="paper container container-m">
  <h2>Übungs<wbr />blatt</h2>
  <div class="form-group">
    <label for="text">Vorname</label>
    <input
      id="text"
      type="text"
      placeholder="Vorname eingeben"
      [ngModel]="text()"
      (ngModelChange)="text.set($event)"
    />
  </div>
  <button
    class="paper-btn btn-primary"
    type="button"
    (click)="generatePdf()"
    [disabled]="lines().length === 0"
  >
    PDF erzeugen
  </button>
</main>
