<main class="paper container container-sm">
  <h2>Vornamen-Blatt</h2>
  <div class="form-group">
    <label for="text">Vorname</label>
    <input
      id="text"
      type="text"
      placeholder="Vorname eingeben"
      [ngModel]="text()"
      (ngModelChange)="text.set($event)"
    />
  </div>
  <button
    class="paper-btn btn-primary"
    type="button"
    (click)="generatePdf()"
    [disabled]="lines().length === 0"
  >
    PDF erzeugen
  </button>
  @if (lines().length > 0) {
    <section class="preview">
      <h4>Preview</h4>
      @for (line of lines(); track $index) {
        <p class="line">{{ line }}</p>
      }
    </section>
  }
</main>
